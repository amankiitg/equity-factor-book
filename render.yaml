# Render deployment blueprint -- EFB live book (Sprint E11, Part B).
#
# Two services:
#   1. efb-live-dashboard: always-on Streamlit web service. Supabase only.
#   2. efb-live-daily:     the daily cron that extends the data and model,
#                          proposes the book, runs the morning execution and
#                          reconciles. Supabase plus Alpaca paper keys.
#
# UTC cron schedule:
#   "30 22 * * 1-5" = 18:30 EDT / 17:30 EST, after the 16:00 ET close.
#
# Secret isolation:
#   Dashboard gets EFB_SUPABASE_DB_URL (a READ-ONLY Postgres role's
#   connection string) and EFB_DB_SCHEMA. NO Alpaca keys.
#   Cron gets EFB_SUPABASE_DB_URL (the write role's connection string),
#   EFB_DB_SCHEMA, EFB_ALPACA_PAPER_*, EFB_DRY_RUN and the notification
#   webhook (its own credential, cron only: the dashboard never sends).
#   Env var VALUES are set manually in the Render dashboard (sync: false).
#   This file commits the KEY names only; no credentials appear here.

services:
  - type: web
    name: efb-live-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: streamlit run live/dashboard_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: EFB_SUPABASE_DB_URL
        sync: false
      - key: EFB_DB_SCHEMA
        sync: false
      # EFB_ALPACA_* are intentionally absent from this service: the
      # dashboard never calls Alpaca directly. EFB_SUPABASE_DB_URL holds a
      # read-only role's connection string, never the service-role key.

  - type: cron
    name: efb-live-daily
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    schedule: "30 22 * * 1-5"
    startCommand: python scripts/run_live_daily.py
    envVars:
      - key: EFB_SUPABASE_DB_URL
        sync: false
      - key: EFB_DB_SCHEMA
        sync: false
      - key: EFB_ALPACA_PAPER_API_KEY
        sync: false
      - key: EFB_ALPACA_PAPER_SECRET_KEY
        sync: false
      - key: EFB_DRY_RUN
        sync: false
      # The notification credentials belong to the cron alone: nothing else
      # sends a message. The key is EFB's own Resend key with sending access
      # only, and the two addresses are the owner's own. Values go in the Render
      # dashboard, never here, and never in git.
      - key: EFB_RESEND_API_KEY
        sync: false
      - key: EFB_NOTIFY_EMAIL_FROM
        sync: false
      - key: EFB_NOTIFY_EMAIL_TO
        sync: false
