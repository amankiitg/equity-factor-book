# Render deployment blueprint -- EFB live book (Sprint E11, Part B).
#
# Two cron services, both jobs over one image. The live book monitor runs on
# Cloudflare (a Worker or Pages project reading the snapshot through an R2 binding
# behind Access), so there is no Render web service and no read role: one fewer
# credential and one fewer box to fall over. `live/dashboard_app.py` stays
# runnable locally as a research view until the Cloudflare page is proven.
#
# Cron 1, `efb-live-daily`: extends the data and model, proposes the book, runs the
# morning execution, reconciles, and writes one JSON snapshot per run to R2.
#
# Cron 2, `efb-fills-reconcile`: the morning after, reads the previous evening's
# orders from the broker by `broker_order_id` -- filled quantity, average fill
# price, final status and cancel time -- writes them to `efb.fills`, adds an
# "actual holdings" section to the snapshot beside the target book, and emails
# only when an order did not fill. It never sizes a book and never sends an order,
# and it is deliberately not part of cron 1: a job that only reads must not be able
# to make the evening's run fail, and the evening's run must not be able to make
# this one report nothing.
#
# UTC cron schedules:
#   "30 22 * * 1-5" = 18:30 EDT / 17:30 EST, after the 16:00 ET close.
#   "0 15 * * 1-5"  = 11:00 EDT / 10:00 EST, the next morning: a DAY order placed
#                     the evening before has filled at the 09:30 ET open or been
#                     cancelled, and the book is read before that day's evening.
#                     14:00 UTC was the first choice and is wrong for half the
#                     year: it is 10:00 EDT (after the open) but 09:00 EST, half
#                     an hour BEFORE the open, when every leg is still working and
#                     the reconciliation would record the whole book as unfilled.
#                     15:00 UTC is after the open in both halves of the year, and
#                     `tests/test_week1_fills_cron.py` pins that against the
#                     exchange's own calendar on both sides of the DST change.
#
# The run refuses outside 16:00-20:00 New York, the after-hours session Alpaca
# holds a DAY order for, unless EFB_FORCE_HOUR is exactly "true". The slot above
# is inside the window in both EDT and EST, so the override is for a rehearsal
# and never for this cron.
#
# Secret isolation:
#   Both crons take the same one environment group, `efb-live`, so each shared
#   key exists once in the workspace and two services cannot drift apart on it.
#   The group holds exactly these thirteen keys, no more:
#     EFB_SUPABASE_DB_URL      the write role's connection string
#     EFB_DB_SCHEMA            `efb`
#     EFB_ALPACA_PAPER_API_KEY / EFB_ALPACA_PAPER_SECRET_KEY  the paper keys
#     EFB_ALPACA_ACCOUNT_ID    the account those keys must reach, checked every run
#     EFB_RESEND_API_KEY / EFB_NOTIFY_EMAIL_FROM / EFB_NOTIFY_EMAIL_TO
#     EFB_SNAPSHOT             the switch the writer requires
#     EFB_R2_ACCOUNT_ID / EFB_R2_BUCKET / EFB_R2_ACCESS_KEY_ID /
#     EFB_R2_SECRET_ACCESS_KEY the snapshot bucket, scoped to that one bucket
#   The evening cron adds four keys of its own, and they stay on it so cron 2
#   cannot get them: EFB_DRY_RUN (the switch that makes a run trade), EFB_INIT_STORE
#   (the one-time seed request) and the EFB_SEED_R2_* four (history it must not
#   read, let alone write). EFB_STORE is deliberately absent everywhere.
#
#   The group's VALUES are not in this file and are not `sync: false` either:
#   Render ignores `sync: false` inside an environment group, so a group declared
#   here would come out empty and every key would be missing. The group is created
#   in the dashboard (Env Groups -> New Environment Group, named `efb-live`) and
#   referenced by name from both services. See the merge-day checklist in
#   `docs/week1_orders_runbook.md` for the exact order of the steps: the group
#   must exist and carry the values before this file is synced, and the moved keys
#   must then be deleted from each service's own Environment page, because a
#   service-level value always beats a linked group's.
#
#   This file commits the KEY names only; no credentials appear here.

services:
  - type: cron
    name: efb-live-daily
    runtime: python
    # The measured peak is 1,146,863,616 bytes (1.07 GiB) and the rule is 2x
    # headroom, so 2 GB is out. From Render's Blueprint reference, the `plan`
    # field's Cron Job table: "| 2 CPU | 4 GB | `2c-4g` |", which is 3.5x the
    # peak. The same page, on omitting the field: "Render uses `0.5c-512mb` for a
    # new web service, private service, background worker, or cron job", so
    # without this line the cron would be created on 512 MB and fall over on the
    # first evening.
    plan: 2c-4g
    buildCommand: pip install -r requirements.txt && pip install -e .
    schedule: "30 22 * * 1-5"
    startCommand: python scripts/run_live_daily.py
    envVars:
      - fromGroup: efb-live
      # The explicit first-run request, set for the first run only. Unset or
      # "false" is a normal run, "true" seeds the store from the git artifacts and
      # writes its marker, and any other value is an error that names it. The
      # owner sets it for the first run and deletes it before the next evening; a
      # flag left set on a seeded store fails the run loudly.
      - key: EFB_INIT_STORE
        sync: false
      - key: EFB_DRY_RUN
        sync: false
      # The seed bucket, read-only here, and absent from cron 2. The frozen
      # history lives in `efb-seed`, a private bucket of its own, separate from the
      # snapshot bucket: every parquet under data/ is gitignored, so the deploy
      # image holds no artifacts at all, and a run downloads the seed and verifies
      # every hash before it reads anything. The local .env holds a write token
      # under these same names for scripts/push_seed.py, which refuses to run where
      # RENDER is set, so the cron has no write path into history. The bucket name
      # defaults to efb-seed.
      - key: EFB_SEED_R2_ACCOUNT_ID
        sync: false
      - key: EFB_SEED_R2_BUCKET
        sync: false
      - key: EFB_SEED_R2_ACCESS_KEY_ID
        sync: false
      - key: EFB_SEED_R2_SECRET_ACCESS_KEY
        sync: false

  # The morning after: what the broker actually did with the previous evening's
  # orders, and what the account holds as a result. Read-only by construction --
  # `scripts/reconcile_fills.py` has no sizing and no submit path, and the test
  # for it walks the module's own syntax tree to prove it -- so it is separate
  # from the evening's run rather than a step inside it: the evening's job is the
  # one that trades, and a failure to read a fill back should not be able to stop
  # it, nor be silently swallowed by it.
  #
  # The group above is its whole environment: it reads the account, the store and
  # the published snapshot, writes `efb.fills` and the section, and emails. Every
  # variable it opens is one of `efb-live`'s thirteen, which is asserted at run
  # time rather than assumed (`tests/test_week1_fills_cron.py` watches the job's
  # own `os.environ` reads and fails if it grows a key the group does not have).
  # `EFB_DRY_RUN`, `EFB_INIT_STORE` and the seed bucket's four stay off this
  # service: this job never trades, has nothing to seed and reads no history.
  #
  # It is also the only job that reads the published snapshot back, adds the one
  # section describing the account, and writes it again. That is what makes the
  # page able to show the target book beside the book the account holds.
  - type: cron
    name: efb-fills-reconcile
    runtime: python
    # Same plan as the evening cron: this job runs the same image and the same
    # price downloader over one evening's tickers, and its own peak has not been
    # measured. The 2x-headroom rule is satisfied by a plan that is known to hold
    # 2.14 GiB of work, and an unmeasured job is not the place to save on memory.
    plan: 2c-4g
    buildCommand: pip install -r requirements.txt && pip install -e .
    schedule: "0 15 * * 1-5"
    startCommand: python scripts/reconcile_fills.py
    envVars:
      - fromGroup: efb-live
