# Render deployment blueprint -- EFB live book (Sprint E11, Part B).
#
# One service: the daily cron. The live book monitor runs on Cloudflare (a Worker
# or Pages project reading the snapshot through an R2 binding behind Access), so
# there is no Render web service and no read role: one fewer credential and one
# fewer box to fall over. `live/dashboard_app.py` stays runnable locally as a
# research view until the Cloudflare page is proven.
#
# The cron: extends the data and model, proposes the book, runs the morning
# execution, reconciles, and writes one JSON snapshot per run to R2.
#
# UTC cron schedule:
#   "30 22 * * 1-5" = 18:30 EDT / 17:30 EST, after the 16:00 ET close.
#
# Secret isolation:
#   Cron gets EFB_SUPABASE_DB_URL (the write role's connection string),
#   EFB_DB_SCHEMA, EFB_ALPACA_PAPER_*, EFB_DRY_RUN, EFB_STORE is deliberately
#   absent, the notification credentials and the R2 credentials. The R2 token is
#   scoped to the one bucket with object read and write.
#   Env var VALUES are set manually in the Render dashboard (sync: false).
#   This file commits the KEY names only; no credentials appear here.

services:
  - type: cron
    name: efb-live-daily
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    schedule: "30 22 * * 1-5"
    startCommand: python scripts/run_live_daily.py
    envVars:
      - key: EFB_SUPABASE_DB_URL
        sync: false
      - key: EFB_DB_SCHEMA
        sync: false
      - key: EFB_ALPACA_PAPER_API_KEY
        sync: false
      - key: EFB_ALPACA_PAPER_SECRET_KEY
        sync: false
      - key: EFB_DRY_RUN
        sync: false
      # The notification credentials belong to the cron alone: nothing else
      # sends a message. The key is EFB's own Resend key with sending access
      # only, and the two addresses are the owner's own. Values go in the Render
      # dashboard, never here, and never in git.
      - key: EFB_RESEND_API_KEY
        sync: false
      - key: EFB_NOTIFY_EMAIL_FROM
        sync: false
      - key: EFB_NOTIFY_EMAIL_TO
        sync: false
      # The report's surface: one JSON object per run, uploaded to R2. The switch
      # is required, so neither default is assumed: `off` is allowed only while
      # EFB_DRY_RUN is true, and with dry_run false it is an error.
      - key: EFB_SNAPSHOT
        sync: false
      - key: EFB_R2_ACCOUNT_ID
        sync: false
      - key: EFB_R2_BUCKET
        sync: false
      - key: EFB_R2_ACCESS_KEY_ID
        sync: false
      - key: EFB_R2_SECRET_ACCESS_KEY
        sync: false
