repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.4.2
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [numpy, pandas, types-requests]

  # The symlink accident, twice in three weeks: a worktree's `.venv` link and a `data`
  # link both reached the index because the working tree looked right. This refuses the
  # commit instead of cleaning up after it.
  - repo: local
    hooks:
      - id: symlink-guard
        name: data/ and .venv are not symlinks, in the tree or the index
        entry: python scripts/check_symlinks.py
        language: system
        pass_filenames: false
        always_run: true
