[project]
name = "equity-factor-book"
version = "0.1.0"
description = "Equity Factor Book: from raw prices to a hedged, sized, cost-aware, paper-traded long/short book with ex-post attribution, in 13 sprints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "arch>=6.3",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "streamlit>=1.35",
    "plotly>=5.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "types-requests>=2.31",
    # the snapshot schema test validates the writer's output against docs/snapshot.schema.json
    "jsonschema>=4.21",
]
live = [
    "alpaca-py>=0.20",
    "psycopg[binary]>=3.1",
    "pandas_market_calendars>=4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["efb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: reads the built artifacts or an executed notebook instead of a fixture",
    "slow: over about two seconds; the fast subset skips it, the full run does not",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yfinance", "pandas", "requests", "alpaca", "alpaca.trading.*"]
ignore_missing_imports = true
